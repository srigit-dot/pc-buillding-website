<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PC Build Simulation Store</title>
  <link rel="stylesheet" href="simstore.css" />
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap"
        rel="stylesheet" />
</head>
<body>
  <header>
    <h1><i class="fas fa-microchip"></i> PC Build Simulation Store</h1>
  </header>

  <main>
    <section class="form-section">
      <h2>Build a PC Within Your Budget</h2>
      <div class="form-row">
        <div class="input-group">
          <label for="budget">Budget ($)</label>
          <input type="number" id="budget" placeholder="Enter your budget" />
        </div>
        <div class="input-group">
          <label for="task">Usage Type</label>
          <select id="task">
            <option value="general">General Tasks</option>
            <option value="cpu">CPU‑Intensive Tasks</option>
            <option value="gpu">GPU‑Intensive Tasks</option>
          </select>
        </div>
        <button onclick="generateBuild()">
          <i class="fas fa-bolt"></i> Simulate Build
        </button>
      </div>
    </section>

    <section class="results-section">
      <div id="buildOutput" class="output"></div>
      <div id="suggestionOutput" class="suggestion"></div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 PC Build Store</p>
  </footer>

  <script src="simstore.js"></script>
</body>
</html>
